# golangci-lint configuration file
# See https://golangci-lint.run/usage/configuration/

version: "2"
linters:
  enable:
    - depguard
  settings:
    depguard:
      rules:
        # internal/tui is the only package that imports dry/tui (decisions D15).
        dry-tui:
          files:
            - $all
            - "!**/internal/tui/**"
          deny:
            - pkg: github.com/safedep/dry/tui
              desc: import internal/tui. Only internal/tui imports dry/tui (decisions D15).
        # Only the enrichers and the cloud plugins speak the SafeDep API contract (decisions D2).
        safedep-api:
          files:
            - $all
            - "!**/internal/plugins/enrichers/**"
            - "!**/internal/plugins/cloud/**"
            - "!**/test/acceptance/stub/**"
            - "!**/model/**"
          deny:
            - pkg: buf.build/gen/go/safedep/api
              desc: only internal/plugins/enrichers and internal/plugins/cloud import the SafeDep API (decisions D2). model imports the package messages only, for the ecosystem enum and the wire form.
        # model.PackageVersion holds each package identity rule. Ask model for a name, a key or an order.
        dry-identity:
          files:
            - $all
            - "!**/model/**"
          deny:
            - pkg: github.com/safedep/dry/api/pb
              desc: use model.PackageVersion. Only model imports dry/api/pb.
        version-order:
          files:
            - $all
          deny:
            - pkg: github.com/safedep/dry/semver
              desc: use model.PackageVersion.Compare. It orders versions under the rule of each ecosystem.
  exclusions:
    paths: []

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
