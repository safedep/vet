          - type: call
            value: "System.Security.Cryptography.HMACSHA384"
          - type: call
            value: "HMACSHA256.HashData"
          - type: call
            value: "System.Security.Cryptography.HMACSHA256.HashData"
          - type: call
            value: "HMACSHA512.HashData"
          - type: call
            value: "System.Security.Cryptography.HMACSHA512.HashData"
