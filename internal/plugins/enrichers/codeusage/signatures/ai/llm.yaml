version: 0.1
# Generated from ai_sigs.py. One id for each library, with the call forms
# of each language.

signatures:
  - id: ai.litellm
    description: "Calls many LLM providers through LiteLLM"
    vendor: "BerriAI"
    product: "LiteLLM"
    service: "LLM gateway"
    tags: [ai, llm, gateway]
    languages:
      python:
        match: any
        conditions:
          - type: call
            value: "litellm.*"

  - id: ai.genai_rs
    description: "Calls many LLM providers through the genai crate"
    vendor: ""
    product: "genai"
    service: "LLM gateway"
    tags: [ai, llm, gateway]
    languages:
      rust:
        match: any
        conditions:
          - type: call
            value: "genai::*"

  - id: ai.ruby_llm
    description: "Calls many LLM providers through RubyLLM"
    vendor: ""
    product: "RubyLLM"
    service: "LLM gateway"
    tags: [ai, llm, gateway]
    languages:
      ruby:
        match: any
        conditions:
          - type: call
            value: "RubyLLM::*"

  - id: ai.omniai
    description: "Calls many LLM providers through OmniAI"
    vendor: ""
    product: "OmniAI"
    service: "LLM gateway"
    tags: [ai, llm, gateway]
    languages:
      ruby:
        match: any
        conditions:
          - type: call
            value: "OmniAI::*"

  - id: ai.prism
    description: "Calls many LLM providers through Prism"
    vendor: ""
    product: "Prism"
    service: "LLM gateway"
    tags: [ai, llm, gateway]
    languages:
      php:
        match: any
        conditions:
          - type: call
            value: "Prism\\Prism\\*"

  - id: ai.vertexai
    description: "Google Cloud Vertex AI models and endpoints"
    vendor: "Google"
    product: "Vertex AI"
    service: "AI client"
    tags: [ai, llm]
    languages:
      python:
        match: any
        conditions:
          - type: call
            value: "vertexai.*"
          - type: call
            value: "google.cloud.aiplatform.*"
      javascript:
        match: any
        conditions:
          - type: call
            value: "@google-cloud/vertexai/*"
          - type: call
            value: "@google-cloud/aiplatform/*"
      java:
        match: any
        conditions:
          - type: call
            value: "com.google.cloud.vertexai.*"
          - type: call
            value: "com.google.cloud.aiplatform.*"
      go:
        match: any
        conditions:
          - type: call
            value: "cloud.google.com/go/vertexai/*"
          - type: call
            value: "cloud.google.com/go/aiplatform/*"
      csharp:
        match: any
        conditions:
          - type: call
            value: "Google.Cloud.AIPlatform.*"

  - id: ai.replicate
    description: "Runs models on Replicate"
    vendor: "Replicate"
    product: "Replicate"
    service: "AI client"
    tags: [ai, llm]
    languages:
      python:
        match: any
        conditions:
          - type: call
            value: "replicate.*"
      javascript:
        match: any
        conditions:
          - type: call
            value: "replicate"
          - type: call
            value: "replicate/*"
      go:
        match: any
        conditions:
          - type: call
            value: "github.com/replicate/replicate-go/*"

  - id: azure.ai.foundry
    description: "Azure AI inference, projects and agents"
    vendor: "Microsoft"
    product: "Azure AI Foundry"
    service: "AI client"
    tags: [ai, llm, agent]
    languages:
      python:
        match: any
        conditions:
          - type: call
            value: "azure.ai.inference.*"
          - type: call
            value: "azure.ai.projects.*"
          - type: call
            value: "azure.ai.agents.*"
      javascript:
        match: any
        conditions:
          - type: call
            value: "@azure-rest/ai-inference/*"
          - type: call
            value: "@azure/ai-projects/*"
          - type: call
            value: "@azure/ai-agents/*"
      java:
        match: any
        conditions:
          - type: call
            value: "com.azure.ai.inference.*"
          - type: call
            value: "com.azure.ai.projects.*"
          - type: call
            value: "com.azure.ai.agents.*"
      csharp:
        match: any
        conditions:
          - type: call
            value: "Azure.AI.Inference.*"
          - type: call
            value: "Azure.AI.Projects.*"
          - type: call
            value: "Azure.AI.Agents.*"

  - id: ai.instructor
    description: "Gets structured output from LLMs with Instructor"
