        match: any
        conditions:
          - type: call
            value: "tensorflow.*"
          - type: call
            value: "keras.*"
          - type: call
            value: "tf_keras.*"
      javascript:
        match: any
        conditions:
          - type: call
            value: "@tensorflow/tfjs/*"
          - type: call
            value: "@tensorflow/tfjs-node/*"
          - type: call
            value: "@tensorflow/tfjs-node-gpu/*"
          - type: call
            value: "@tensorflow-models/*"
      java:
        match: any
        conditions:
          - type: call
            value: "org.tensorflow.*"
      go:
        match: any
        conditions:
          - type: call
            value: "github.com/tensorflow/tensorflow/tensorflow/go/*"
          - type: call
            value: "github.com/galeone/tfgo/*"
      csharp:
        match: any
        conditions:
          - type: call
            value: "Tensorflow.*"
      rust:
        match: any
        conditions:
          - type: call
            value: "tensorflow::*"

