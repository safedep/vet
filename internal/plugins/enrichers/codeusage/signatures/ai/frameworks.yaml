version: 0.1
# Generated from ai_sigs.py. One id for each library, with the call forms
# of each language.

signatures:
  - id: ai.pytorch
    description: "PyTorch tensors and neural networks"
    vendor: "Meta"
    product: "PyTorch"
    service: "ML framework"
    tags: [ai, ml]
    languages:
      python:
        match: any
        conditions:
          - type: call
            value: "torch.*"
          - type: call
            value: "torchvision.*"
          - type: call
            value: "torchaudio.*"
      java:
        match: any
        conditions:
          - type: call
            value: "org.pytorch.*"
      csharp:
        match: any
        conditions:
          - type: call
            value: "TorchSharp.*"
      rust:
        match: any
        conditions:
          - type: call
            value: "tch::*"
      ruby:
        match: any
        conditions:
          - type: call
            value: "Torch::*"

  - id: ai.tensorflow
    description: "TensorFlow and Keras models"
