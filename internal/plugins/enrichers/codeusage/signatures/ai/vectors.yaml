version: 0.1
# Generated from ai_sigs.py. One id for each library, with the call forms
# of each language.

signatures:
  - id: ai.sentence_transformers
    description: "Computes text embeddings"
    vendor: "Hugging Face"
    product: "Sentence Transformers"
    service: "Embeddings"
    tags: [ai, embeddings]
    languages:
      python:
        match: any
        conditions:
          - type: call
            value: "sentence_transformers.*"

  - id: ai.fastembed
    description: "Computes text embeddings with FastEmbed"
    vendor: "Qdrant"
    product: "FastEmbed"
    service: "Embeddings"
    tags: [ai, embeddings]
    languages:
      python:
        match: any
        conditions:
          - type: call
            value: "fastembed.*"
      rust:
        match: any
        conditions:
          - type: call
            value: "fastembed::*"

  - id: ai.chroma
    description: "Stores and queries embeddings in Chroma"
    vendor: "Chroma"
    product: "Chroma"
    service: "Vector database"
    tags: [ai, vectordb]
    languages:
      python:
        match: any
        conditions:
          - type: call
            value: "chromadb.*"
      javascript:
        match: any
        conditions:
          - type: call
            value: "chromadb/*"
      java:
        match: any
        conditions:
          - type: call
            value: "tech.amikos.chromadb.*"
      go:
        match: any
        conditions:
          - type: call
            value: "github.com/amikos-tech/chroma-go/*"
      rust:
        match: any
        conditions:
          - type: call
            value: "chromadb::*"
      ruby:
        match: any
        conditions:
          - type: call
            value: "Chroma::*"

  - id: ai.pinecone
    description: "Stores and queries embeddings in Pinecone"
    vendor: "Pinecone"
    product: "Pinecone"
    service: "Vector database"
    tags: [ai, vectordb]
    languages:
      python:
        match: any
        conditions:
          - type: call
            value: "pinecone.*"
      javascript:
        match: any
        conditions:
          - type: call
            value: "@pinecone-database/pinecone/*"
      java:
        match: any
        conditions:
          - type: call
            value: "io.pinecone.*"
      go:
        match: any
        conditions:
          - type: call
            value: "github.com/pinecone-io/go-pinecone/*"
      csharp:
        match: any
        conditions:
          - type: call
            value: "Pinecone.*"
      rust:
        match: any
        conditions:
          - type: call
            value: "pinecone_sdk::*"
      ruby:
        match: any
        conditions:
          - type: call
            value: "Pinecone::*"

