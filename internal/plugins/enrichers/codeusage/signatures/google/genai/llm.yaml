version: 0.1
# References -
# https://pypi.org/project/google-genai/
# https://www.npmjs.com/package/@google/genai
# https://central.sonatype.com/artifact/com.google.genai/google-genai
# https://github.com/google-gemini/gemini-php
# https://github.com/gbaptista/gemini-ai

signatures:
  - id: google.genai.client
    description: "Google Gemini API client (google-genai SDK)"
    vendor: "Google"
    product: "Gemini"
    service: "AI client"
    tags: [ai, llm, text]
    languages:
      python:
        match: any
        conditions:
          - type: call
            value: "google.genai.Client"
          - type: call
            value: "google.generativeai.*"
      javascript:
        match: any
        conditions:
          - type: call
            value: "@google/genai/GoogleGenAI"
          - type: call
            value: "@google/generative-ai/*"
      java:
        match: any
        conditions:
          - type: call
            value: "com.google.genai.Client.builder"
      go:
        match: any
        conditions:
          - type: call
            value: "google.golang.org/genai/*"
          - type: call
            value: "github.com/google/generative-ai-go/genai/*"
      csharp:
        match: any
        conditions:
          - type: call
            value: "Google.GenAI.*"
          - type: call
            value: "Mscc.GenerativeAI.*"
      php:
        match: any
        conditions:
          - type: call
            value: "Gemini\\*"
      ruby:
        match: any
        conditions:
          - type: call
            value: "Gemini::*"

  - id: google.genai.sdk
    description: "Google Gemini SDK API surfaces (models, chats, embeddings)"
    vendor: "Google"
    product: "Gemini"
    service: "AI model operations"
    tags: [ai, llm, text, embeddings]
    languages:
      python:
        match: any
        conditions:
          - type: call
            value: "google.genai.*"
      javascript:
        match: any
        conditions:
          - type: call
            value: "@google/genai/*"
      java:
        match: any
        conditions:
          - type: call
            value: "com.google.genai.*"
