[project]
name = "my-app"
version = "1.0.0"
dependencies = [
  "requests[socks]>=2.31,<3",
  "click==8.1.7 ; python_version >= '3.9'",
  "rich",
  "attrs~=23.1",
  "mylib @ git+https://github.com/example/mylib",
  "django<5",
]

[project.optional-dependencies]
async = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8.0", { include-group = "lint" }]
lint = ["ruff==0.6.9"]
