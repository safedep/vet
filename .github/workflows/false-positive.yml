name: False-positive run

# Scans clean projects at fixed commits and fails on each attack finding.
# It clones from GitHub, so it is advisory: never a required check. A change
# that edits a detection runs it on dispatch. GitHub runs the schedule on
# the default branch only.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (default: the triggering ref)"
        required: false
        default: ""
  schedule:
    - cron: "41 4 * * 1"

concurrency:
  group: false-positive-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  false-positive:
    name: False-positive run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Scan the clean projects
        env:
          VET_FP_REPORT: ${{ runner.temp }}/false-positive.md
        run: go test -tags falsepositive -count=1 -timeout 50m ./test/falsepositive/

      - name: Write the summary
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/false-positive.md" ]; then
            cat "${RUNNER_TEMP}/false-positive.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the table
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: false-positive-report
          path: ${{ runner.temp }}/false-positive.md
          if-no-files-found: ignore
