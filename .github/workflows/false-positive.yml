name: False-positive run

# Scans clean projects at fixed commits and fails on each attack finding.
# It clones from GitHub, so it is advisory: never a required check. A pull
# request that changes a detection or the corpus runs it, and so does a
# dispatch. GitHub runs the schedule on the default branch only.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (default: the triggering ref)"
        required: false
        default: ""
  schedule:
    - cron: "41 4 * * 1"
  pull_request:
    branches: [v2]
    paths:
      - "internal/technique/**"
      - "internal/hiddentext/**"
      - "internal/plugins/controls/**"
      - "internal/plugins/extractors/agentconfig/**"
      - "internal/plugins/extractors/hiddencode/**"
      - "internal/plugins/internal/agentfiles/**"
      - "internal/plugins/internal/hiddencode/**"
      - "test/evasion/**"
      - "test/falsepositive/**"
      - ".github/workflows/false-positive.yml"

concurrency:
  group: false-positive-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  false-positive:
    name: False-positive run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Scan the clean projects
        env:
          VET_FP_REPORT: ${{ runner.temp }}/false-positive.md
        run: go test -tags falsepositive -count=1 -timeout 50m ./test/falsepositive/

      - name: Write the summary
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/false-positive.md" ]; then
            cat "${RUNNER_TEMP}/false-positive.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the table
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: false-positive-report
          path: ${{ runner.temp }}/false-positive.md
          if-no-files-found: ignore
