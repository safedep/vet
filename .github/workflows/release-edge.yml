name: Release Edge

# Publishes an alpha pre-release of vet v2 when a pull request merges to the
# v2 branch: a GitHub pre-release, the vet@edge Homebrew cask and the
# container image tags v2-latest and the version. It never writes a channel
# of vet v1. test/release checks the rules that keep it so.
#
# Only a push to v2 starts it. It has no manual dispatch and no pull request
# trigger, so no release runs before a merge.
on:
  push:
    branches: [v2]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: release-edge
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/safedep/vet

jobs:
  ci:
    if: github.repository == 'safedep/vet'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: ci
    environment: v2-edge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # to create the GitHub pre-release
      id-token: write # to sign the provenance
      attestations: write # to write the provenance
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      latest_release: ${{ steps.before.outputs.latest_release }}
      latest_image: ${{ steps.before.outputs.latest_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      # The tag comes from the clock only. Nothing in it comes from an input.
      - name: Make the tag
        id: tag
        run: |
          tag="v2.0.0-alpha.$(date -u +%Y%m%d%H%M%S)"
          if [[ ! "$tag" =~ ^v2\.0\.0-alpha\.[0-9]{14}$ ]]; then
            echo "::error::The tag $tag is not a v2 alpha tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Users of vet v1 pin the latest image and the latest GitHub release. The
      # verify job fails when the release changes either of them.
      - name: Record the v1 channels
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "latest_release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" >> "$GITHUB_OUTPUT"
          echo "latest_image=$(docker buildx imagetools inspect --raw "$IMAGE:latest" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # goreleaser creates the release with GITHUB_TOKEN, and GitHub creates
      # the tag from the release. A tag from GITHUB_TOKEN starts no workflow.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git tag "$GORELEASER_CURRENT_TAG" "$GITHUB_SHA"
          .github/scripts/goreleaser-cross.sh release --clean

      - name: Check the artifacts
        run: .github/scripts/check-dist.sh

      - name: Check the release is a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: test "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-checksums: dist/checksums.txt

  container:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # to push the image
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Registry login
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${TAG#v}" \
            -t "$IMAGE:v2-latest" \
            -t "$IMAGE:$TAG" \
            .

  verify:
    needs: [release, container]
    if: always() && needs.release.outputs.latest_image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check that the v1 channels did not change
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_RELEASE: ${{ needs.release.outputs.latest_release }}
          LATEST_IMAGE: ${{ needs.release.outputs.latest_image }}
        run: |
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          image=$(docker buildx imagetools inspect --raw "$IMAGE:latest" | sha256sum | cut -d' ' -f1)
          if [ "$release" != "$LATEST_RELEASE" ]; then
            echo "::error::The latest GitHub release changed from $LATEST_RELEASE to $release"
            exit 1
          fi
          if [ "$image" != "$LATEST_IMAGE" ]; then
            echo "::error::The digest of the latest image changed. Users of vet v1 run this image."
            exit 1
          fi

  smoke:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Install the cask
        run: |
          brew install --cask safedep/tap/vet@edge
          vet version

  prune:
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to delete old pre-releases
    steps:
      # Keep the last 5 alpha releases, so the v1 releases stay visible. The
      # tags stay, because the Go module proxy keeps them.
      - name: Delete old alpha releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^v2\\.0\\.0-alpha\\.[0-9]{14}$")))] | sort_by(.tagName) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            done
