name: Release Snapshot

# Builds the release with goreleaser in the goreleaser-cross image and
# publishes nothing. It checks the binary for each platform, CGO in each
# binary and the Homebrew cask before a merge releases them.
on:
  pull_request:
    branches: [v2]
    paths:
      - ".goreleaser.yaml"
      - ".github/workflows/release-snapshot.yml"
      - ".github/workflows/release-edge.yml"
      - ".github/scripts/**"
      - "Dockerfile"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "**.go"

permissions:
  contents: read

jobs:
  snapshot:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    # The cask template reads the tap token. The snapshot uploads nothing.
    env:
      HOMEBREW_TAP_GITHUB_TOKEN: unused
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Check the config
        run: .github/scripts/goreleaser-cross.sh check

      - name: Build a snapshot
        run: .github/scripts/goreleaser-cross.sh release --snapshot --clean --skip=publish

      - name: Check the artifacts
        run: .github/scripts/check-dist.sh

      - name: Upload the macOS archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: darwin
          path: dist/*_Darwin_all.tar.gz

  smoke-macos:
    needs: snapshot
    timeout-minutes: 15
    runs-on: macos-latest
    steps:
      - name: Download the macOS archive
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: darwin

      - name: Run the binary
        run: |
          tar -xzf ./*_Darwin_all.tar.gz vet
          ./vet version

  container:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build the image
        run: docker build --build-arg VERSION=2.0.0-snapshot -t vet:snapshot .

      - name: Check the version of the image
        run: |
          docker run --rm vet:snapshot version | grep -F '"version": "2.0.0-snapshot"'
