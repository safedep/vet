name: Release Snapshot

# Builds the release with goreleaser in the goreleaser-cross image and
# publishes nothing. It checks the binary for each platform, CGO in each
# binary and the Homebrew cask before a merge releases them.
on:
  pull_request:
    branches: [v2]
    paths:
      - ".goreleaser.yaml"
      - ".github/workflows/release-snapshot.yml"
      - ".github/workflows/release-edge.yml"
      - ".github/scripts/**"
      - "Dockerfile"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "**.go"

permissions:
  contents: read

jobs:
  snapshot:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    # The cask template reads the tap token. The snapshot uploads nothing.
    env:
      HOMEBREW_TAP_GITHUB_TOKEN: unused
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check the config
        run: .github/scripts/goreleaser-cross.sh check

      - name: Build a snapshot
        run: .github/scripts/goreleaser-cross.sh release --snapshot --clean --skip=publish

      - name: Check the artifacts
        run: .github/scripts/check-dist.sh

      - name: Upload the macOS archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin
          path: dist/*_Darwin_all.tar.gz

  smoke-macos:
    needs: snapshot
    timeout-minutes: 15
    runs-on: macos-latest
    steps:
      - name: Download the macOS archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: darwin

      - name: Run the binary
        run: |
          tar -xzf ./*_Darwin_all.tar.gz vet
          ./vet version

  container:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --build-arg VERSION=2.0.0-snapshot -t vet:snapshot .

      - name: Check the version of the image
        run: |
          out=$(docker run --rm vet:snapshot version -o json)
          echo "$out"
          grep -F '"version": "2.0.0-snapshot"' <<< "$out"
