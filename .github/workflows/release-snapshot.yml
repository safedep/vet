name: Release Snapshot

# Builds the release with goreleaser and publishes nothing. It checks the
# binary for each platform and the Homebrew cask before a tag does.
on:
  pull_request:
    branches: [v2]
    paths:
      - ".goreleaser.yaml"
      - ".github/workflows/goreleaser.yml"
      - ".github/workflows/release-snapshot.yml"
      - "go.mod"
      - "cmd/vet/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true
          version: "~> v2"

      - name: Check the config
        run: goreleaser check

      - name: Build a snapshot
        run: goreleaser release --snapshot --clean --skip=publish

      - name: Check the artifacts
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.[] | select(.type == "Binary") | "\(.goos)/\(.goarch)"' dist/artifacts.json | sort > platforms.txt
          cat platforms.txt
          printf '%s\n' darwin/all linux/amd64 linux/arm64 windows/amd64 | diff - platforms.txt
          test -f dist/homebrew/Casks/vet.rb
          grep -q 'binary "vet"' dist/homebrew/Casks/vet.rb
          bin=$(jq -r '.[] | select(.type == "Binary" and .goos == "linux" and .goarch == "amd64") | .path' dist/artifacts.json)
          "$bin" version
