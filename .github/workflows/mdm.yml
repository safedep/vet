name: MDM Scripts

on:
  pull_request:
    branches: [main, v2]
    paths:
      - scripts/mdm/**
      - .github/workflows/mdm.yml
  push:
    branches: [main, v2]
    paths:
      - scripts/mdm/**
      - .github/workflows/mdm.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mdm-scripts-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run MDM script tests
        run: bash scripts/mdm/tests/vet_endpoint_scan_test.sh

      - name: Lint MDM scripts
        if: matrix.os == 'ubuntu-latest'
        run: |
          shellcheck -x \
            scripts/mdm/vet_endpoint_scan.sh \
            scripts/mdm/tests/vet_endpoint_scan_test.sh
