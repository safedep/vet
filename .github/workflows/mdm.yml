name: MDM Scripts

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/mdm/**
      - .github/workflows/mdm.yml
  push:
    branches: [main]
    paths:
      - scripts/mdm/**
      - .github/workflows/mdm.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mdm-scripts-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run MDM script tests
        run: bash scripts/mdm/tests/vet_endpoint_scan_test.sh

      - name: Lint MDM scripts
        if: matrix.os == 'ubuntu-latest'
        run: |
          shellcheck -x \
            scripts/mdm/vet_endpoint_scan.sh \
            scripts/mdm/tests/vet_endpoint_scan_test.sh
