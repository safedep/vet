name: Secrets Scan
on:
  pull_request:
    branches:
      - main
      - v2

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: '0'
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@3bcf19f51e91a9655d84ddb623728c7620be482a
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }} 

