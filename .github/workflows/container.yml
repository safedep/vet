name: Container Image Releaser

# vet v2 publishes no Docker image until the program owner decides its
# distribution (decisions D13). The workflow runs only on manual dispatch.
on:
  workflow_dispatch:

concurrency: ci-container-release

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    if: "!contains(github.event.commits[0].message, '[noci]')"
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          fetch-depth: 0

      - name: Registry Login
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and Push Container Image
        run: |
          # Get the tag if this was a tag push event
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG=${{ github.ref_name }}
            # Validate tag format (must be vX.Y.Z)
            if [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              # Build and push with both version tag and latest
              docker buildx build --push --platform linux/amd64,linux/arm64 \
                -t $REGISTRY/$IMAGE_NAME:$TAG \
                -t $REGISTRY/$IMAGE_NAME:latest \
                .
            else
              echo "Invalid tag format. Must be in format vX.Y.Z (e.g. v1.2.3)"
              exit 1
            fi
          else
            # For non-tag pushes, just use latest tag
            docker buildx build --push --platform linux/amd64,linux/arm64 \
              -t $REGISTRY/$IMAGE_NAME:latest \
              .
          fi
