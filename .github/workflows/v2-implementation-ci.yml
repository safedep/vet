# Temporary workflow for the vet v2 implementation branch.
# Remove it before the branch merges into v2.
name: v2 Implementation CI

on:
  push:
    branches:
      - claude/vet-v2-implementation

permissions:
  contents: read

concurrency:
  group: v2-implementation-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: |
          go vet ./...
          # Two v1 packages need CGO, which a cross build turns off: go-tree-sitter
          # and go-sqlite3. v2 deletes them. Until then the cross vet skips the
          # packages whose builds or tests depend on them.
          for goos in darwin windows; do
            skip=$(GOOS=$goos go list -test -f '{{.ImportPath}} {{join .Deps " "}}' ./... \
              | grep -e 'smacker/go-tree-sitter' -e 'mattn/go-sqlite3' | cut -d' ' -f1 | sed 's/\.test$//' | sort -u)
            GOOS=$goos go vet $(go list ./... | grep -vxF -f <(echo "$skip"))
          done

      - name: Test
        run: go test ./...

  lint:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.14.0
          # The v1 tree has lint issues. Report only the issues that are new against v2.
          args: --issues-exit-code=1 --timeout=10m --new-from-rev=origin/v2
