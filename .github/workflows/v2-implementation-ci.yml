# Temporary workflow for the vet v2 implementation branch.
# Remove it before the branch merges into v2.
name: v2 Implementation CI

on:
  push:
    branches:
      - claude/vet-v2-implementation

permissions:
  contents: read

concurrency:
  group: v2-implementation-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: |
          go vet ./...
          for goos in darwin windows; do
            GOOS=$goos go vet ./...
          done

      - name: Test
        run: go test ./...

  acceptance:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      # The hermetic acceptance run gates the change. It calls no network.
      - name: Acceptance (hermetic)
        run: go test -tags acceptance -count=1 ./test/acceptance/ -run TestAcceptance

  lint:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.14.0
          # The v1 tree has lint issues. Report only the issues that are new against v2.
          args: --issues-exit-code=1 --timeout=10m --new-from-rev=origin/v2
