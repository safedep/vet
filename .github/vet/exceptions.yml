name: vet exceptions
description: |
  The packages that the policy flags and that vet accepts. safedep/dry and
  safedep/code are SafeDep libraries with few GitHub stars. The other
  packages come in through osv-scalibr and go-git, and the low-popularity
  or no-maintenance check flags them. Review each one when it expires.
exceptions:
