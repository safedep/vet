name: Set up PMG
description: >-
  Starts the PMG proxy as root with kernel enforcement, so every process of the
  job goes through it. Call it right after the checkout. At the end of the job,
  the post step of safedep/pmg stops PMG, fails the job when PMG blocked a
  package, and writes a job summary with a proposed network profile. Linux
  only. See https://github.com/safedep/pmg/blob/main/docs/github-action.md.

inputs:
  api-key:
    description: SafeDep Cloud API key for the audit events. Empty sends none.
    required: false
    default: ""
  tenant-id:
    description: SafeDep Cloud tenant of the API key.
    required: false
    default: ""
  network-profile:
    description: >-
      The network profile of the job, a path under .github/pmg/network/. While
      the file does not exist, PMG applies no network policy, and the job
      summary proposes a profile for this path.
    required: true

runs:
  using: composite
  steps:
    - uses: safedep/pmg@ee9c6ccfb8c7cc31280fb91f1fa5031ec1c6ff18 # v0.34.0
      with:
        # Dependabot updates only the SHA above. Keep this tag equal to it.
        version: v0.34.0
        api-key: ${{ inputs.api-key }}
        tenant-id: ${{ inputs.tenant-id }}
        endpoint-id: CICD_GHA_VET
        enforce: true
        # The cooldown and its skip list. The path is relative to the checkout.
        config-file: .github/pmg/config.yml
        network-profile: ${{ inputs.network-profile }}
        # audit lets every connection through and reports each destination
        # that the profile does not allow. Change it to enforce when each job
        # has a reviewed profile.
        network-mode: audit
