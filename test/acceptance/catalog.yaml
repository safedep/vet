- id: ci/setup/init
  title: "vet ci init adds the vet workflow"
  category: ci
  tier: P1
  guarantee: "vet ci init writes the vet workflow with the action and actions/checkout pinned to commit SHAs, adds a github-actions Dependabot entry with new lines only, and does not replace a workflow that exists."
