# --- 4.8 Other surfaces: vet endpoint audit ---
- id: endpoint/audit/inventory
  title: "endpoint audit: inventory and packages"
  category: endpoint
  tier: P1
  guarantee: "vet endpoint audit reports the MCP servers and skills of the home directory as inventory, with no secret value, and checks the IDE extensions and global npm packages as packages. vet scan never reads the home directory."
  labels: [endpoint]
- id: endpoint/audit/tools-table
  title: "endpoint audit: the table lists the tools"
  category: endpoint
  tier: P1
  guarantee: "The table of vet endpoint audit counts the tools by kind and lists each one. The first step line names the machine, not the manifests."
  labels: [endpoint]
- id: endpoint/audit/all-users-needs-root
  title: "endpoint audit: --all-users needs root"
  category: endpoint
  tier: P2
  guarantee: "vet endpoint audit --all-users without root exits 2 and says to run it with sudo."
  labels: [endpoint]
- id: endpoint/agent-config/findings
  title: "endpoint audit: agent config findings"
  category: endpoint
  tier: P1
  guarantee: "vet endpoint audit with a home directory that holds a risky .vscode/tasks.json and an MCP config gives findings."
  labels: [endpoint, agent-config]
- id: endpoint/agent-config/user-tasks
  title: "endpoint audit: editor user tasks"
  category: endpoint
  tier: P1
  guarantee: "vet endpoint audit reads the user tasks.json of VS Code in the config folder of the home directory, and a suspicious task in it gives a finding."
  labels: [endpoint, agent-config]
- id: endpoint/projects/hidden-code
  title: "endpoint audit: hidden code in local repositories"
  category: endpoint
  tier: P1
  guarantee: "vet endpoint audit --projects DIR checks the repositories under DIR. A build config with code after a run of spaces gives a critical padded-code finding with the repository in its path, a .gitignore that hides temp_auto_push.bat gives history-rewrite-script, and the attacks gate fails. A clean repository gives none. A --projects folder that does not exist exits 2."
  labels: [endpoint, hidden-code, attacks]
- id: endpoint/npm/entry
  title: "endpoint audit: an overwritten npm entry script"
  category: endpoint
  tier: P1
  guarantee: "vet endpoint audit gives a critical padded-code finding for a global npm lib/cli.js that is far larger than the published file, and the attacks gate fails."
  labels: [endpoint, hidden-code, attacks]
- id: endpoint/inventory-sync/wal
  title: "endpoint audit: inventory sync log"
  category: endpoint
  tier: P2
  guarantee: "With plugins.cloud-inventory on, vet endpoint audit writes its inventory to inventory-sync.wal in the state directory with mode 0600, records inventory_sync_unavailable, and completes."
  labels: [endpoint, cloud, stub]
