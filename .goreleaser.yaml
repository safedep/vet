# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com
version: 2
# The module path ends in /v2, so goreleaser would name the project v2.
project_name: vet
before:
  hooks:
    - go mod tidy

# The code usage analysis needs CGO. The release runs in the
# goreleaser-cross image, which has a C cross compiler for each target.
builds:
  - id: vet
    main: ./cmd/vet
    ldflags:
      - -s -w -X github.com/safedep/vet/v2/internal/version.version={{.Version}} -X github.com/safedep/vet/v2/internal/version.commit={{.Commit}}
    env:
      - CGO_ENABLED=1
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    overrides:
      - goos: linux
        goarch: amd64
        env: [CC=x86_64-linux-gnu-gcc, CXX=x86_64-linux-gnu-g++]
      - goos: linux
        goarch: arm64
        env: [CC=aarch64-linux-gnu-gcc, CXX=aarch64-linux-gnu-g++]
      - goos: darwin
        goarch: amd64
        env: [CC=o64-clang, CXX=o64-clang++]
      - goos: darwin
        goarch: arm64
        env: [CC=oa64-clang, CXX=oa64-clang++]
      - goos: windows
        goarch: amd64
        env: [CC=x86_64-w64-mingw32-gcc, CXX=x86_64-w64-mingw32-g++]

# vet v2 ships as an alpha pre-release on each merge to the v2 branch. A
# pre-release that is not the latest release never reaches the v1 channels:
# the vet-action, the Homebrew formula and "mise use github:safedep/vet" read
# the latest release. test/release checks these values.
release:
  prerelease: "true"
  make_latest: "false"
  target_commitish: "{{ .FullCommit }}"
  footer: |
    This is an alpha build of vet v2 from the v2 branch. vet v1 is the latest release.

universal_binaries:
  - replace: true

homebrew_casks:
  # A fixed name, so a v2 build never writes the vet cask of v1.
  - name: vet@edge
    directory: Casks
    homepage: https://safedep.io
    description: "SafeDep vet is a tool for identifying open source software supply chain risks"
    license: "Apache-2.0"
    binaries:
      - vet
    conflicts:
      - cask: vet
    # Homebrew 7 deprecates the `postflight` stanza that goreleaser writes from
    # `hooks.post.install`. The block below writes `postflight_steps` instead.
    # goreleaser runs a template pass over the rendered cask, so the quoted form
    # is what emits Homebrew's own `{{staged_path}}` token. Move this to
    # `hooks.post.install_steps` when goreleaser/goreleaser#6873 ships.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/vet"], must_succeed: false
        end
      end
    repository:
      owner: safedep
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: "checksums.txt"
  algorithm: sha256
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
# The lines beneath this are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
