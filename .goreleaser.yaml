# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com
version: 2
# The module path ends in /v2, so goreleaser would name the project v2.
project_name: vet
before:
  hooks:
    - go mod tidy

# vet v2 needs no CGO, so one static build covers each platform.
builds:
  - id: vet
    main: ./cmd/vet
    ldflags:
      - -s -w -X github.com/safedep/vet/v2/internal/version.version={{.Version}} -X github.com/safedep/vet/v2/internal/version.commit={{.Commit}}
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # The npm packages have no Windows arm64 build.
    ignore:
      - goos: windows
        goarch: arm64

# vet v2 publishes nothing yet. The GitHub release and the Homebrew tap are
# the release channels of vet v1, so a v2 build must not reach them. The
# program owner decides how v2 ships to early adopters (Linear FOU-416 and
# FOU-417). Until then no workflow runs a release, and a manual
# "goreleaser release" creates no GitHub release and uploads no cask.
release:
  disable: true

universal_binaries:
  - replace: true

homebrew_casks:
  - name: vet
    directory: Casks
    homepage: https://safedep.io
    description: "SafeDep vet is a tool for identifying open source software supply chain risks"
    license: "Apache-2.0"
    binaries:
      - vet
    # Homebrew 7 deprecates the `postflight` stanza that goreleaser writes from
    # `hooks.post.install`. The block below writes `postflight_steps` instead.
    # goreleaser runs a template pass over the rendered cask, so the quoted form
    # is what emits Homebrew's own `{{staged_path}}` token. Move this to
    # `hooks.post.install_steps` when goreleaser/goreleaser#6873 ships.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/vet"], must_succeed: false
        end
      end
    skip_upload: true
    # The release is disabled, so the cask cannot take its download URL from it.
    url:
      template: "https://github.com/safedep/vet/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    repository:
      owner: safedep
      name: homebrew-tap
      branch: main

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: "checksums.txt"
  algorithm: sha256
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
# The lines beneath this are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/use them.
